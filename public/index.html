        const messages = [
          { type: "text", text: DEFAULT_TEXT },
          FLEX_MESSAGE
        ];

        let started = false;

        const timeout = (promise, ms, message) => {
          let timer;
          const limit = new Promise((_, reject) => {
            timer = window.setTimeout(() => reject(new Error(message)), ms);
          });

          return Promise.race([promise, limit]).finally(() => window.clearTimeout(timer));
        };

        const closeWindow = () => {
          try {
            if (window.liff && liff.isInClient()) {
              window.setTimeout(() => liff.closeWindow(), 180);
            }
          } catch (error) {
            console.warn("Unable to close LIFF window", error);
          }
        };

        const allowTapToRetry = () => {
          started = false;
          window.addEventListener("touchend", start, { once: true, passive: true });
          window.addEventListener("click", start, { once: true });
        };

        async function start() {
          if (started) return;
          started = true;

          try {
            await timeout(liff.init({ liffId: LIFF_ID }), 8000, "LIFF init timed out");

            if (!liff.isLoggedIn()) {
              liff.login({ redirectUri: window.location.href });
              return;
            }

            if (!liff.isApiAvailable("shareTargetPicker")) {
              throw new Error("shareTargetPicker is unavailable.");
            }

            const result = await timeout(
              liff.shareTargetPicker(messages, { isMultiple: false }),
              30000,
              "shareTargetPicker timed out"
            );

            if (result) {
              closeWindow();
              return;
            }

            allowTapToRetry();
          } catch (error) {
            console.warn("LINE share failed", error);
            allowTapToRetry();
          }
        }

        const boot = () => {
          if (!window.liff) {
            window.setTimeout(boot, 40);
            return;
          }

          start();
        };

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", boot, { once: true });
        } else {
          boot();
        }
      })();
    </script>
