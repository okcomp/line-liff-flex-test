<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LINEで宿泊先をシェア</title>
    <link rel="preconnect" href="https://static.line-scdn.net" />
    <link rel="preload" href="flex-message.json" as="fetch" type="application/json" crossorigin="anonymous" />
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
      :root {
        color-scheme: light;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f7f5;
        color: #222222;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
      }

      main {
        width: min(100%, 380px);
      }

      .page-header {
        margin-bottom: 12px;
      }

      h1 {
        margin: 0;
        font-size: 22px;
        line-height: 1.2;
        letter-spacing: 0;
      }

      .intro {
        margin: 4px 0 0;
        color: #5f5f5f;
        font-size: 13px;
        line-height: 1.35;
      }

      .pdp-card {
        overflow: hidden;
        background: #ffffff;
        border: 1px solid #dddddd;
        border-radius: 8px;
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.1);
      }

      .cover {
        display: block;
        width: 100%;
        aspect-ratio: 2 / 1;
        object-fit: cover;
        background: #eeeeee;
      }

      .pdp-content {
        padding: 16px;
      }

      .title-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 14px;
        align-items: start;
      }

      .pdp-title {
        margin: 0;
        font-size: 20px;
        font-weight: 800;
        line-height: 1.22;
        letter-spacing: 0;
      }

      .rating {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
        font-size: 19px;
        font-weight: 800;
        line-height: 1;
      }

      .star {
        font-size: 15px;
      }

      .pdp-subtitle {
        margin: 10px 0 0;
        color: #5f5f5f;
        font-size: 14px;
        line-height: 1.38;
      }

      .dates {
        margin: 2px 0 0;
        color: #5f5f5f;
        font-size: 14px;
        line-height: 1.35;
      }

      .price {
        margin: 10px 0 0;
        font-size: 17px;
        line-height: 1.25;
      }

      .price-main {
        font-weight: 800;
        text-decoration: underline;
      }

      .price-sub {
        color: #5f5f5f;
      }

      .payment-note {
        display: inline-flex;
        margin-top: 9px;
        padding: 4px 9px;
        border-radius: 6px;
        background: #f0f0f0;
        color: #5f5f5f;
        font-size: 14px;
        font-weight: 700;
      }

      .status {
        margin: 12px 0 0;
        color: #222222;
        font-size: 13px;
        font-weight: 700;
      }

      .status.error {
        color: #b00020;
      }

      .status.done {
        color: #008a05;
      }

      .actions {
        display: grid;
        gap: 8px;
        margin-top: 12px;
      }

      button {
        appearance: none;
        border: 0;
        border-radius: 8px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 18px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
      }

      button.primary {
        background: #ff385c;
        color: #ffffff;
      }

      button.secondary {
        background: #eeeeee;
        color: #222222;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

    </style>
  </head>
  <body>
    <main>
      <header class="page-header">
        <h1>LINEでシェア</h1>
        <p class="intro">宿泊先カードを送信します。</p>
      </header>

      <section class="pdp-card" aria-label="宿泊先の概要">
        <img
          class="cover"
          src="https://a0.muscache.com/im/pictures/hosting/Hosting-1239731270268012685/original/b2cf0b77-0967-4b21-931e-e369d9ee3b0a.jpeg?im_w=1440"
          fetchpriority="low"
          alt=""
        />
        <div class="pdp-content">
          <div class="title-row">
            <p class="pdp-title">軽井沢町の一軒家</p>
            <div class="rating" aria-label="評価 4.92">
              <span class="star" aria-hidden="true">★</span>
              <span>4.92</span>
            </div>
          </div>

          <p class="pdp-subtitle">軽井沢追分｜森の中の1棟貸切別荘｜寝室1・ベッド3・バスルーム1</p>
          <p class="dates">6月15日〜20日</p>
          <p class="price"><span class="price-main">¥131,907</span><span class="price-sub">（5泊）</span></p>
          <div class="payment-note">本日のお支払いは¥0</div>
        </div>
      </section>

      <div id="status" class="status" aria-live="polite">
        <span id="statusText">シェアを準備中...</span>
      </div>

      <div class="actions">
        <button id="shareButton" class="primary" disabled>LINEでシェア</button>
        <button id="closeButton" class="secondary" type="button">閉じる</button>
      </div>
    </main>

    <script>
      const LIFF_ID = "2010072810-4TWyKraj";
      const MESSAGE_ENDPOINT = "flex-message.json";
      const params = new URLSearchParams(window.location.search);
      const shouldAutoShare = params.get("auto") !== "0";

      const statusEl = document.querySelector("#status");
      const statusTextEl = document.querySelector("#statusText");
      const shareButton = document.querySelector("#shareButton");
      const closeButton = document.querySelector("#closeButton");
      let flexMessagePromise;

      const transientErrorPattern =
        /Load failed|Failed to fetch|NetworkError|network|timeout|timed out/i;

      function setStatus(message, tone = "loading") {
        statusTextEl.textContent = message;
        statusEl.classList.toggle("ready", tone === "ready");
        statusEl.classList.toggle("done", tone === "done");
        statusEl.classList.toggle("error", tone === "error");
      }

      function getErrorMessage(error) {
        if (error instanceof Error && error.message) {
          return error.message;
        }
        return String(error);
      }

      function isTransientError(error) {
        return transientErrorPattern.test(getErrorMessage(error));
      }

      function sleep(ms) {
        return new Promise((resolve) => {
          window.setTimeout(resolve, ms);
        });
      }

      async function withRetry(task, { attempts = 2, delayMs = 350 } = {}) {
        let lastError;

        for (let attempt = 1; attempt <= attempts; attempt += 1) {
          try {
            return await task();
          } catch (error) {
            lastError = error;

            if (attempt === attempts || !isTransientError(error)) {
              break;
            }

            await sleep(delayMs * attempt);
          }
        }

        throw lastError;
      }

      async function waitForLineClientReady() {
        await Promise.race([
          new Promise((resolve) => {
            window.requestAnimationFrame(resolve);
          }),
          sleep(80)
        ]);
        await sleep(120);
      }

      async function fetchFlexMessage() {
        const response = await fetch(MESSAGE_ENDPOINT);
        if (!response.ok) {
          throw new Error(`メッセージを読み込めません (${response.status})`);
        }
        return response.json();
      }

      async function loadFlexMessage() {
        if (!flexMessagePromise) {
          flexMessagePromise = withRetry(fetchFlexMessage, {
            attempts: 3,
            delayMs: 300
          }).catch((error) => {
            flexMessagePromise = undefined;
            throw error;
          });
        }

        return flexMessagePromise;
      }

      async function shareListing({ auto = false } = {}) {
        shareButton.disabled = true;
        setStatus("LINEを開いています...", "loading");

        try {
          if (!liff.isApiAvailable("shareTargetPicker")) {
            throw new Error("この環境ではLINEシェアを利用できません。");
          }

          const message = await loadFlexMessage();
          const result = await withRetry(
            () =>
              liff.shareTargetPicker([message], {
                isMultiple: false
              }),
            {
              attempts: auto ? 2 : 1,
              delayMs: 500
            }
          );

          if (result) {
            setStatus("LINEでシェアしました。", "done");
            if (liff.isInClient()) {
              liff.closeWindow();
            }
          } else {
            setStatus("もう一度シェアできます。", "ready");
          }
        } catch (error) {
          console.warn("LINE share failed", error);
          setStatus(
            isTransientError(error)
              ? "もう一度シェアできます。"
              : getErrorMessage(error),
            isTransientError(error) ? "ready" : "error"
          );
        } finally {
          shareButton.disabled = false;
        }
      }

      async function init() {
        try {
          await withRetry(() => liff.init({ liffId: LIFF_ID }), {
            attempts: 2,
            delayMs: 500
          });

          if (!liff.isLoggedIn()) {
            setStatus("LINEログインを開いています...", "loading");
            liff.login({ redirectUri: window.location.href });
            return;
          }

          if (!liff.isApiAvailable("shareTargetPicker")) {
            setStatus("この環境ではLINEシェアを利用できません。", "error");
            return;
          }

          shareButton.disabled = false;
          setStatus(shouldAutoShare ? "LINEを開いています..." : "シェアできます。", "ready");

          if (shouldAutoShare) {
            await waitForLineClientReady();
            await shareListing({ auto: true });
          }
        } catch (error) {
          console.warn("LIFF init failed", error);
          setStatus(getErrorMessage(error), "error");
        }
      }

      void loadFlexMessage().catch(() => undefined);

      shareButton.addEventListener("click", () => {
        shareListing();
      });
      closeButton.addEventListener("click", () => {
        if (window.liff && liff.isInClient()) {
          liff.closeWindow();
        } else {
          window.close();
        }
      });

      init();
    </script>
  </body>
</html>
