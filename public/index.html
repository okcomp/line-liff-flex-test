<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LINEで宿泊先をシェア</title>
    <link rel="preconnect" href="https://static.line-scdn.net" />
    <link rel="preload" href="flex-message.json" as="fetch" type="application/json" crossorigin="anonymous" />
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
      :root {
        color-scheme: light;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f7f5;
        color: #222222;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 440px);
      }

      .page-header {
        margin-bottom: 18px;
      }

      .kicker {
        margin: 0 0 8px;
        color: #717171;
        font-size: 13px;
        font-weight: 700;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        line-height: 1.15;
        letter-spacing: 0;
      }

      .intro {
        margin: 8px 0 0;
        color: #5f5f5f;
        font-size: 15px;
        line-height: 1.45;
      }

      .pdp-card {
        overflow: hidden;
        background: #ffffff;
        border: 1px solid #dddddd;
        border-radius: 8px;
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.1);
      }

      .cover {
        display: block;
        width: 100%;
        aspect-ratio: 20 / 13;
        object-fit: cover;
        background: #eeeeee;
      }

      .pdp-content {
        padding: 20px;
      }

      .pdp-title {
        margin: 0;
        font-size: 22px;
        font-weight: 800;
        line-height: 1.32;
        letter-spacing: 0;
      }

      .pdp-subtitle {
        margin: 8px 0 0;
        color: #5f5f5f;
        font-size: 15px;
        line-height: 1.45;
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin-top: 18px;
        padding-top: 16px;
        border-top: 1px solid #ebebeb;
      }

      .metric {
        min-width: 0;
      }

      .metric-label {
        margin: 0 0 4px;
        color: #717171;
        font-size: 11px;
        font-weight: 700;
      }

      .metric-value {
        margin: 0;
        font-size: 15px;
        font-weight: 800;
        line-height: 1.25;
        overflow-wrap: anywhere;
      }

      .payment-note {
        display: inline-flex;
        margin-top: 16px;
        padding: 6px 12px;
        border-radius: 999px;
        background: #f0f0f0;
        color: #3f3f3f;
        font-size: 14px;
        font-weight: 700;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 24px;
        margin: 18px 0 0;
        color: #222222;
        font-size: 14px;
        font-weight: 700;
      }

      .spinner {
        width: 16px;
        height: 16px;
        border: 2px solid #dddddd;
        border-top-color: #ff385c;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      .status.ready .spinner,
      .status.error .spinner,
      .status.done .spinner {
        animation: none;
        border-color: currentColor;
      }

      .status.error {
        color: #b00020;
      }

      .status.done {
        color: #008a05;
      }

      .actions {
        display: grid;
        gap: 10px;
        margin-top: 18px;
      }

      button {
        appearance: none;
        border: 0;
        border-radius: 8px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 18px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
      }

      button.primary {
        background: #ff385c;
        color: #ffffff;
      }

      button.secondary {
        background: #eeeeee;
        color: #222222;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="page-header">
        <p class="kicker">LINE</p>
        <h1>LINEで宿泊先をシェア</h1>
        <p class="intro">友だちに送る宿泊先カードを準備しています。</p>
      </header>

      <section class="pdp-card" aria-label="宿泊先の概要">
        <img
          class="cover"
          src="https://a0.muscache.com/im/pictures/hosting/Hosting-1239731270268012685/original/b2cf0b77-0967-4b21-931e-e369d9ee3b0a.jpeg?im_w=1440"
          fetchpriority="low"
          alt=""
        />
        <div class="pdp-content">
          <p class="pdp-title">軽井沢追分｜森の中の1棟貸切別荘</p>
          <p class="pdp-subtitle">長野県軽井沢町のまるまる貸切の一軒家</p>

          <div class="metrics">
            <div class="metric">
              <p class="metric-label">評価</p>
              <p class="metric-value">★ 4.92</p>
            </div>
            <div class="metric">
              <p class="metric-label">日程</p>
              <p class="metric-value">6月15日〜20日</p>
            </div>
            <div class="metric">
              <p class="metric-label">料金</p>
              <p class="metric-value">¥131,907</p>
            </div>
          </div>

          <div class="payment-note">本日のお支払いは¥0</div>
        </div>
      </section>

      <div id="status" class="status" aria-live="polite">
        <span class="spinner" aria-hidden="true"></span>
        <span id="statusText">シェアを準備中...</span>
      </div>

      <div class="actions">
        <button id="shareButton" class="primary" disabled>LINEでシェア</button>
        <button id="closeButton" class="secondary" type="button">閉じる</button>
      </div>
    </main>

    <script>
      const LIFF_ID = "2010072810-4TWyKraj";
      const MESSAGE_ENDPOINT = "flex-message.json";
      const params = new URLSearchParams(window.location.search);
      const shouldAutoShare = params.get("auto") !== "0";

      const statusEl = document.querySelector("#status");
      const statusTextEl = document.querySelector("#statusText");
      const shareButton = document.querySelector("#shareButton");
      const closeButton = document.querySelector("#closeButton");
      const flexMessagePromise = fetchFlexMessage();

      function setStatus(message, tone = "loading") {
        statusTextEl.textContent = message;
        statusEl.classList.toggle("ready", tone === "ready");
        statusEl.classList.toggle("done", tone === "done");
        statusEl.classList.toggle("error", tone === "error");
      }

      async function fetchFlexMessage() {
        const response = await fetch(MESSAGE_ENDPOINT, { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`メッセージを読み込めません (${response.status})`);
        }
        return response.json();
      }

      async function shareListing() {
        shareButton.disabled = true;
        setStatus("LINEを開いています...", "loading");

        try {
          if (!liff.isApiAvailable("shareTargetPicker")) {
            throw new Error("この環境ではLINEシェアを利用できません。");
          }

          const message = await flexMessagePromise;
          const result = await liff.shareTargetPicker([message], {
            isMultiple: false
          });

          if (result) {
            setStatus("LINEでシェアしました。", "done");
          } else {
            setStatus("シェアをキャンセルしました。", "ready");
          }
        } catch (error) {
          setStatus(error.message || String(error), "error");
        } finally {
          shareButton.disabled = false;
        }
      }

      async function init() {
        try {
          await liff.init({ liffId: LIFF_ID });

          if (!liff.isLoggedIn()) {
            setStatus("LINEログインを開いています...", "loading");
            liff.login({ redirectUri: window.location.href });
            return;
          }

          if (!liff.isApiAvailable("shareTargetPicker")) {
            setStatus("この環境ではLINEシェアを利用できません。", "error");
            return;
          }

          shareButton.disabled = false;
          setStatus(shouldAutoShare ? "LINEを開いています..." : "シェアできます。", "ready");

          if (shouldAutoShare) {
            await shareListing();
          }
        } catch (error) {
          setStatus(error.message || String(error), "error");
        }
      }

      shareButton.addEventListener("click", shareListing);
      closeButton.addEventListener("click", () => {
        if (window.liff && liff.isInClient()) {
          liff.closeWindow();
        } else {
          window.close();
        }
      });

      init();
    </script>
  </body>
</html>
